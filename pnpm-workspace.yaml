packages:
  - frontend
  - backend
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js: false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true
  vue-demi: true
